<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d3c35">
<title>Pizarra de Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
[hidden]{display:none!important}
:root{
  /* Layout: toda la pantalla es una pizarra de aula con marco de madera. Tablero a la izquierda y mesa del profe (botones) a la derecha en la tele; apilado en el celular.
     La tiza de colores codifica el proceso: amarilla = lo que llevamos, rosada = lo que prestamos, celeste = dónde vamos, verde = correcto. */
  --pizarra:#1d3c35; --pizarra-hondo:#122822; --pizarra-alto:#295145;
  --marco:#8a623b; --marco-oscuro:#4e341f;
  --tiza:#f3f1e6; --tiza-suave:#b7c8bd; --tiza-tenue:rgba(243,241,230,.13);
  --amarilla:#ffd35a; --rosa:#ff93b6; --celeste:#86d5ff; --verde:#a9e785;
  --obj-rojo:#ff6f60; --obj-verde:#93d85c; --obj-azul:#6fa9ff; --hoja:#5aa846; --tallo:#7a5530; --brillo:rgba(255,255,255,.5);
  --f-titulo:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-texto:"Andika",Verdana,system-ui,sans-serif;
  --t-xxl:clamp(2.6rem,11vmin,7rem); --t-xl:clamp(2rem,8vmin,5rem); --t-l:clamp(1.5rem,5.2vmin,3.2rem);
  --t-m:clamp(1.1rem,3.3vmin,2rem); --t-s:clamp(.95rem,2.3vmin,1.3rem);
  --celda:clamp(40px,9.2vmin,92px); --obj:clamp(30px,7vmin,68px); --punto:clamp(9px,2.3vmin,20px);
  --radio:14px;
  /* Papel y tinta: tarjetas de cartulina pegadas en la pizarra para dibujos y textos */
  --papel:#fbf6e6; --papel-sombra:rgba(0,0,0,.28); --tinta:#1f2d28; --tinta-suave:#5d6b64;
  /* Regletas de colores (Cuisenaire): los colores que usan en la escuela */
  --r1:#f4efe2; --r2:#e53935; --r3:#8bc34a; --r4:#ec5c9a; --r5:#fdd835; --r6:#2e8b3e; --r7:#2b2b2b; --r8:#8d5a3b; --r9:#1e88e5; --r10:#fb8c00;
  --u:clamp(26px,6vmin,60px);
  --resalte:#ffe27a; --tinta-bien:#2f7d1f; --tinta-falta:#c2185b; --tinta-sujeto:#1565c0; --tinta-pred:#b26a00;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--marco-oscuro)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--marco-oscuro);color:var(--tiza);font-family:var(--f-texto);font-size:var(--t-s);line-height:1.35}
button{font:inherit;color:inherit}
.tablero{height:100%;padding:clamp(8px,1.4vmin,16px);background:linear-gradient(160deg,var(--marco),var(--marco-oscuro))}
.superficie{height:100%;display:flex;flex-direction:column;border-radius:8px;overflow:hidden;
  background:radial-gradient(110% 80% at 15% 0%,rgba(255,255,255,.07),transparent 60%),radial-gradient(70% 60% at 90% 100%,rgba(255,255,255,.05),transparent 70%),var(--pizarra);
  box-shadow:inset 0 0 0 3px var(--marco-oscuro),inset 0 0 80px rgba(0,0,0,.35)}
.barra{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding-block:.45em;padding-inline:clamp(16px,3vw,40px);font-family:var(--f-titulo);color:var(--tiza-suave);border-bottom:2px dashed var(--tiza-tenue)}
.marca{font-weight:800;letter-spacing:.02em}
.chip{font-weight:600;color:var(--tiza)}
.estrellas{margin-left:auto;display:inline-flex;align-items:center;gap:.3em;color:var(--amarilla);font-weight:800;font-variant-numeric:tabular-nums}
.chip-control{display:inline-flex;align-items:center;gap:.4em;padding:.1em .7em;border-radius:99px;border:2px dashed var(--tiza-tenue);color:var(--tiza-suave);font-weight:600;font-variant-numeric:tabular-nums}
.chip-control.ok{border-style:solid;border-color:var(--verde);color:var(--verde)}
.estrellas+.chip-control{margin-left:0}
.estrellas[hidden]+.chip-control{margin-left:auto}
.estrella{width:1.1em;height:1.1em;fill:var(--amarilla);flex:none}
#pantalla{flex:1;min-height:0;overflow:auto;padding-block:clamp(10px,2vmin,22px);padding-inline:clamp(16px,3vw,40px)}

/* Tipografía */
.eyebrow{margin:0;font-family:var(--f-titulo);font-weight:600;font-size:var(--t-s);color:var(--tiza-suave);letter-spacing:.04em}
.titulo{margin:0;font-family:var(--f-titulo);font-weight:800;font-size:var(--t-xxl);line-height:.95;text-wrap:balance;position:relative;display:inline-block}
.titulo::after{content:"";position:absolute;left:2%;right:6%;bottom:-.08em;height:.09em;border-radius:99px;background:repeating-linear-gradient(90deg,var(--amarilla) 0 14px,rgba(255,211,90,.55) 14px 18px);transform:rotate(-1deg)}
.titulo-sec{margin:0;font-family:var(--f-titulo);font-weight:800;font-size:var(--t-l);line-height:1.05;text-wrap:balance}
.sub,.lema,.nota{margin:0;font-size:var(--t-m);color:var(--tiza-suave);max-width:46ch}
.lema{color:var(--tiza)}
.ayuda{margin:0;color:var(--tiza-suave)}

/* Botones y foco (pensado para el control de la tele) */
.btn{appearance:none;border:3px solid var(--tiza-tenue);background:var(--pizarra-alto);border-radius:var(--radio);padding:.5em 1em;font-family:var(--f-titulo);font-weight:600;font-size:var(--t-m);cursor:pointer;line-height:1.1;min-height:2.6em}
.btn:disabled{opacity:.35;cursor:default}
.btn-tiza{background:var(--tiza);color:var(--pizarra-hondo);border-color:var(--tiza);font-weight:800}
.btn-suave{background:transparent;border-style:dashed}
.btn.grande{font-size:var(--t-l);padding:.35em 1.2em}
[data-nav]:focus{outline:5px solid var(--amarilla);outline-offset:4px}
[data-nav]:focus:not(:focus-visible){outline-color:var(--amarilla)}
.fila-botones{display:flex;flex-wrap:wrap;gap:clamp(10px,2vmin,20px);align-items:center}

/* Portada */
.portada{min-height:100%;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(16px,4vw,60px);align-items:center}
.portada-texto{display:flex;flex-direction:column;gap:clamp(14px,3vmin,30px);min-width:0}
.portada-muestra{display:flex;flex-direction:column;align-items:center;gap:.6em;min-width:0}
.portada-muestra .eyebrow{text-align:center}
.conexion{display:flex;flex-direction:column;align-items:center;gap:.6em;padding:clamp(14px,2.6vmin,26px);border:3px dashed var(--tiza-tenue);border-radius:18px;text-align:center;max-width:100%}
.conexion .qr{width:clamp(140px,30vmin,250px);aspect-ratio:1;background:#fff;border-radius:12px;padding:8px}
.conexion .qr svg{width:100%;height:100%;display:block}
.codigo{margin:0;font-family:var(--f-titulo);font-weight:600;font-size:var(--t-m)}
.codigo strong{font-weight:800;font-size:1.6em;letter-spacing:.12em;color:var(--amarilla)}
.ayuda-url{margin:0;color:var(--tiza-suave);font-size:var(--t-s);overflow-wrap:anywhere}

/* Tarjetas de jugadores y juegos */
.seccion{display:flex;flex-direction:column;gap:clamp(12px,2.6vmin,26px);min-height:100%}
.tarjetas{display:grid;gap:clamp(12px,2.4vmin,24px);grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.tarjetas.dos{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.tarjeta{appearance:none;text-align:left;display:flex;flex-direction:column;gap:.35em;padding:clamp(14px,2.6vmin,28px);border-radius:18px;border:3px dashed var(--tiza-tenue);background:rgba(0,0,0,.14);cursor:pointer;transition:transform .15s ease,background .15s ease}
.tarjeta:focus,.tarjeta:hover{background:rgba(255,255,255,.06);transform:translateY(-3px)}
.tarjeta-grado{font-family:var(--f-titulo);font-weight:600;color:var(--celeste);font-size:var(--t-s);letter-spacing:.04em}
.tarjeta-nombre{font-family:var(--f-titulo);font-weight:800;font-size:var(--t-l);line-height:1}
.tarjeta-desc{color:var(--tiza-suave);font-size:var(--t-s)}
.tarjeta-pie{display:inline-flex;gap:.35em;align-items:center;color:var(--amarilla);font-family:var(--f-titulo);font-weight:600;margin-top:auto;padding-top:.4em}
.simbolo{font-family:var(--f-titulo);font-weight:800;font-size:var(--t-xl);line-height:.9;color:var(--amarilla)}
.nivel{display:inline-flex;align-items:center;gap:.5em;font-family:var(--f-titulo);font-weight:600;color:var(--tiza)}
.puntos-nivel{display:inline-flex;gap:4px}
.puntos-nivel i{width:.6em;height:.6em;border-radius:50%;border:2px solid var(--tiza-suave)}
.puntos-nivel i.on{background:var(--verde);border-color:var(--verde)}

/* Pantalla de juego */
.juego{height:100%;display:grid;gap:clamp(12px,2.4vmin,26px);min-height:0}
.juego.grande{grid-template-columns:minmax(0,1fr) minmax(250px,34%)}
.juego.peque{grid-template-columns:minmax(0,1fr) minmax(190px,24%);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"vis panel" "fichas fichas"}
.juego.peque .tablero-vis{grid-area:vis}.juego.peque .panel{grid-area:panel}.juego.peque .fichas{grid-area:fichas}
.tablero-vis{display:flex;flex-direction:column;gap:clamp(8px,1.8vmin,18px);min-width:0;min-height:0}
.cabeza-juego{display:flex;flex-wrap:wrap;gap:.6em 1.2em;align-items:center;justify-content:space-between}
.palitos{display:inline-flex;gap:6px;align-items:center}
.palitos i{width:6px;height:1.3em;border-radius:3px;background:var(--tiza-tenue);transform:rotate(8deg)}
.palitos i.hecho{background:var(--tiza)}
.palitos i.ahora{background:var(--amarilla)}
.consigna{margin:0;font-size:var(--t-m);color:var(--tiza-suave);max-width:40ch}
.enunciado{margin:0;font-family:var(--f-titulo);font-weight:800;font-size:var(--t-l);line-height:1.05}
.enunciado.solo-numeros{font-size:var(--t-xxl);margin-block:auto}
.vis-centro{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:auto}
.panel{display:flex;flex-direction:column;gap:clamp(8px,1.6vmin,16px);min-width:0}
.panel .btn{width:100%}

/* Teclado de números */
.teclado{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(6px,1.2vmin,12px)}
.tecla{appearance:none;border:3px solid var(--tiza-tenue);background:var(--pizarra-alto);border-radius:12px;font-family:var(--f-titulo);font-weight:800;font-size:var(--t-l);line-height:1;padding-block:.25em;cursor:pointer;font-variant-numeric:tabular-nums}
.tecla.borrar{grid-column:span 2;font-size:var(--t-m)}
.tecla.comprobar{grid-column:span 3;font-size:var(--t-m);background:var(--tiza);color:var(--pizarra-hondo);border-color:var(--tiza)}

/* Fichas de respuesta del peque */
.fichas{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:clamp(6px,1.2vmin,12px)}
.ficha{appearance:none;aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--tiza-tenue);background:var(--pizarra-alto);font-family:var(--f-titulo);font-weight:800;font-size:var(--t-l);line-height:1;cursor:pointer;padding:0}
.ficha.mal{background:var(--rosa);color:var(--pizarra-hondo)}

/* Objetos para contar */
.vis-peque{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vmin,22px);margin-block:auto}
.eq{margin:0;font-family:var(--f-titulo);font-weight:800;font-size:var(--t-l);line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.grupos{display:flex;flex-wrap:wrap;gap:clamp(14px,3vmin,34px);align-items:center;justify-content:center}
.grupo{display:grid;grid-template-columns:repeat(5,var(--obj));gap:clamp(6px,1.2vmin,12px);padding:clamp(8px,1.4vmin,14px);border:2px dashed var(--tiza-tenue);border-radius:14px}
.signo-grande{font-family:var(--f-titulo);font-weight:800;font-size:var(--t-xl);color:var(--amarilla)}
.obj{position:relative;width:var(--obj);height:var(--obj);display:block}
.obj svg{width:100%;height:100%;display:block;transition:transform .2s ease,opacity .2s ease}
.obj .num{position:absolute;left:50%;top:-.15em;transform:translate(-50%,-100%);font-family:var(--f-titulo);font-weight:800;font-size:calc(var(--obj)*.42);color:var(--amarilla);line-height:1}
.obj .num:empty{display:none}
.obj.s-lit svg{transform:scale(1.12);filter:drop-shadow(0 0 6px var(--amarilla))}
.obj.s-cross svg{opacity:.35}
.obj.s-cross::after{content:"";position:absolute;inset:6%;background:linear-gradient(45deg,transparent 43%,var(--rosa) 43% 57%,transparent 57%),linear-gradient(-45deg,transparent 43%,var(--rosa) 43% 57%,transparent 57%)}

/* Operaciones en columna, como en el cuaderno de cuadros */
.col-op,.div-izq{display:grid;grid-auto-rows:auto;font-family:var(--f-titulo);font-weight:800;font-variant-numeric:tabular-nums;position:relative}
.col-op .c,.div-izq .c{display:flex;align-items:center;justify-content:center;width:var(--celda);position:relative;z-index:1}
.c.dig{height:var(--celda);font-size:calc(var(--celda)*.78);line-height:1;box-shadow:inset 0 0 0 1px rgba(243,241,230,.07)}
.c.sigla{height:calc(var(--celda)*.45);font-size:calc(var(--celda)*.26);color:var(--tiza-suave);font-weight:600;letter-spacing:.05em}
.c.sigla.hl{color:var(--celeste)}
.c.arriba{height:calc(var(--celda)*.55);font-size:calc(var(--celda)*.42)}
.c.lleva{color:var(--amarilla)}
.c.nuevo{color:var(--rosa)}
.c.signo{height:var(--celda);font-size:calc(var(--celda)*.66);color:var(--tiza-suave)}
.c.tachado{color:var(--tiza-suave)}
.c.tachado::after{content:"";position:absolute;left:18%;right:18%;top:50%;height:4px;border-radius:2px;background:var(--rosa);transform:rotate(-28deg)}
.c.hl{color:var(--celeste)}
.c.res.escrito{color:var(--tiza)}
.c.res.escrito.hl{color:var(--celeste)}
.franja{background:rgba(134,213,255,.12);border-radius:10px;z-index:0}
.raya{height:5px;background:var(--tiza);border-radius:3px;margin-block:4px}
.slot{appearance:none;width:calc(var(--celda)*.94);height:calc(var(--celda)*.94);margin:auto;border:3px dashed var(--tiza-suave);border-radius:10px;background:rgba(0,0,0,.18);font-family:var(--f-titulo);font-weight:800;font-size:calc(var(--celda)*.7);line-height:1;padding:0;cursor:pointer;z-index:1}
.slot.activo{border-style:solid;border-color:var(--amarilla);box-shadow:0 0 0 4px rgba(255,211,90,.2)}
.eq-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.4em}
.eq-h .eq{font-size:calc(var(--celda)*.8)}
.eq-h .slots{display:inline-flex;gap:.2em}

/* División */
.galera{display:flex;align-items:flex-start;gap:calc(var(--celda)*.1)}
.casita{font-family:var(--f-titulo);font-weight:800;font-variant-numeric:tabular-nums}
.casita .divisor{height:var(--celda);display:flex;align-items:center;padding-inline:.35em;font-size:calc(var(--celda)*.78);border-left:5px solid var(--tiza);border-bottom:5px solid var(--tiza);min-width:calc(var(--celda)*2.2)}
.casita .cociente{display:flex;gap:2px;padding:.15em .25em;min-height:var(--celda);font-size:calc(var(--celda)*.78)}
.casita .cociente span{width:calc(var(--celda)*.7);text-align:center}
.c.subrayado{box-shadow:inset 0 -4px 0 var(--tiza-suave)}
.c.producto{color:var(--tiza-suave)}

/* Tablas: filas de puntos */
.vis-tabla{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vmin,16px)}
.filas{display:flex;flex-direction:column;gap:calc(var(--punto)*.45)}
.fila{display:flex;align-items:center;gap:1em;opacity:.55;transition:opacity .2s ease}
.fila.lit{opacity:1}
.puntos{display:flex;gap:calc(var(--punto)*.45)}
.puntos i{width:var(--punto);height:var(--punto);border-radius:50%;background:var(--tiza)}
.fila.lit .puntos i{background:var(--celeste)}
.total{font-family:var(--f-titulo);font-weight:800;color:var(--amarilla);font-size:calc(var(--punto)*1.5);min-width:2.2em;opacity:0;font-variant-numeric:tabular-nums}
.fila.lit .total{opacity:1}

/* Repartir */
.vis-rep{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vmin,20px)}
.pozo{display:flex;flex-wrap:wrap;gap:6px;max-width:min(100%,24em);justify-content:center}
.pozo i,.plato i{width:var(--punto);height:var(--punto);border-radius:50%;background:var(--tiza);display:block}
.platos{display:flex;flex-wrap:wrap;gap:clamp(8px,1.6vmin,16px);justify-content:center}
.plato{display:grid;grid-template-columns:repeat(5,var(--punto));grid-auto-rows:var(--punto);gap:5px;padding:.7em .9em;border:3px dashed var(--tiza-suave);border-radius:999px;min-width:calc(var(--punto)*5 + 2.4em);min-height:calc(var(--punto)*2 + 2em);align-content:center}
.plato i{background:var(--celeste)}
.plato i.oculto{visibility:hidden}

/* Explicación paso a paso */
.explica{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,38%);gap:clamp(14px,3vmin,34px);min-height:0}
.profe{display:flex;flex-direction:column;gap:clamp(10px,2vmin,20px);padding-left:clamp(12px,2.4vmin,26px);border-left:3px dashed var(--tiza-tenue);min-width:0}
.texto-paso{margin:0;font-size:var(--t-m);line-height:1.4;max-width:34ch}
.profe .acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}
.profe .acciones .btn{flex:1 1 auto}
.bandeja{display:flex;flex-wrap:wrap;gap:.5em 1.2em;padding:.6em .8em;border-radius:10px;background:rgba(0,0,0,.18);font-size:var(--t-s);color:var(--tiza-suave)}
.bandeja span{display:inline-flex;align-items:center;gap:.45em}
.bandeja i{width:2.2em;height:.5em;border-radius:3px;background:var(--c);transform:rotate(-4deg)}

/* Acierto y fin */
.acierto,.fin{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.6vmin,26px)}
.sello svg{width:clamp(60px,14vmin,140px);height:auto}
.acierto-titulo{margin:0;font-family:var(--f-titulo);font-weight:800;font-size:var(--t-xl);line-height:1;color:var(--verde)}
.eq-final{margin:0;font-family:var(--f-titulo);font-weight:800;font-size:var(--t-l);font-variant-numeric:tabular-nums}
.sube{margin:0;display:inline-flex;gap:.4em;align-items:center;font-size:var(--t-m);color:var(--amarilla)}
.fila-estrellas{display:flex;flex-wrap:wrap;gap:.3em}
.fila-estrellas .estrella{width:clamp(36px,7vmin,64px);height:auto}
.fila-estrellas .estrella.vacia{fill:var(--tiza-tenue)}

/* Progreso */
.progreso{display:flex;flex-direction:column;gap:clamp(12px,2.4vmin,24px)}
.prog-bloque h2{margin:0 0 .4em;font-family:var(--f-titulo);font-weight:800;font-size:var(--t-m)}
.prog-bloque h2 span{font-weight:600;color:var(--celeste);margin-left:.4em;font-size:.8em}
.tabla-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:.45em .7em;border-bottom:1px dashed var(--tiza-tenue);vertical-align:middle}
thead th{font-family:var(--f-titulo);font-weight:600;color:var(--tiza-suave);font-size:.9em}
tbody th{font-family:var(--f-titulo);font-weight:800}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pct{color:var(--tiza-suave)}
.nivel-txt{color:var(--tiza-suave);margin-left:.4em}

/* Aviso */
#aviso{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 3vmin);transform:translateX(-50%);max-width:min(90vw,40em);background:var(--tiza);color:var(--pizarra-hondo);font-family:var(--f-titulo);font-weight:600;font-size:var(--t-m);padding:.5em 1em;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:10;text-align:center}
.escuchando{background:var(--rosa);color:var(--pizarra-hondo)}

@media (max-width:760px),(orientation:portrait){
  .portada,.explica,.juego.grande{grid-template-columns:minmax(0,1fr);height:auto}

/* ---------- Pasos del profesor ---------- */
function snapper(out,st){return function(t,extra){var v=clon(st);if(extra)Object.assign(v,extra);out.push({texto:t,vis:v});};}

function pasosSuma(a,b){
  var R=String(a+b),w=R.length,T=String(a).padStart(w,' ').split(''),B=String(b).padStart(w,' ').split('');
  var st={tipo:'col',op:'+',w:w,top:T.map(function(d){return {d:d};}),bot:B,carry:range(0,w).map(function(){return '';}),res:range(0,w).map(function(){return '';}),hl:-1};

    if(s>=10){st.res[i]=String(s%10);ll=Math.floor(s/10);st.carry[i-1]=String(ll);t+=' Escribimos el '+(s%10)+' y llevamos '+ll+' a las '+LUGAR[w-i]+'.';}
    else{st.res[i]=String(s);ll=0;t+=' Escribimos el '+s+'.';}
    snap(t);
  }
  st.hl=-1;snap('¡Listo! '+a+' + '+b+' = '+(a+b)+'.');
  return out;
}
function pasosResta(a,b){
  var A=String(a),w=A.length,B=String(b).padStart(w,' ').split(''),cur=A.split('').map(Number);
  var st={tipo:'col',op:'−',w:w,top:A.split('').map(function(d){return {d:d,nuevo:null,tachado:false};}),bot:B,carry:range(0,w).map(function(){return '';}),res:range(0,w).map(function(){return '';}),hl:-1};
  var out=[],snap=snapper(out,st);

  snap('Escribimos '+a+' arriba y '+b+' abajo, unidades bajo unidades. Restamos columna por columna, empezando por las unidades.');
  for(var i=w-1;i>=0;i--){
    var lugar=LUGAR[w-1-i];st.hl=i;
    if(B[i]===' '){st.res[i]=String(cur[i]);snap('Columna de las '+lugar+': abajo no hay nada, así que bajamos el '+cur[i]+'.');continue;}
    var db=+B[i];
    if(cur[i]>=db){var r=cur[i]-db;st.res[i]=String(r);snap('Columna de las '+lugar+': '+cur[i]+' − '+db+' = '+r+'. Escribimos el '+r+'.');continue;}
    var j=i-1;while(cur[j]===0)j--;
    var vi=cur[i],vj=cur[j],t='Columna de las '+lugar+': '+cur[i]+' − '+db+'. No alcanza, porque '+cur[i]+' es menor que '+db+'. ';
    cur[j]-=1;for(var k=j+1;k<i;k++){cur[k]=9;marcar(k);}cur[i]+=10;marcar(j);marcar(i);
    if(j===i-1){t+='Pedimos prestado 1 a las '+LUGAR[w-1-j]+': el '+vj+' se vuelve '+cur[j]+', y nuestro '+vi+' se vuelve '+cur[i]+'.';}
    else{var ceros=i-j-1;t+=(ceros===1?'Las '+LUGAR[w-i]+' tienen 0':'Las columnas de al lado tienen 0')+' y no pueden prestar. Pedimos a las '+LUGAR[w-1-j]+': el '+vj+' se vuelve '+cur[j]+'. '+(ceros===1?'El 0 recibe 10, presta 1 y se queda en 9.':'Cada 0 recibe 10, presta 1 y se queda en 9.')+' Y nuestro '+vi+' se vuelve '+cur[i]+'.';}
    snap(t);

  }

}
function pasosMultCol(a,b){

  var st={tipo:'col',op:'×',w:w,top:T.map(function(d){return {d:d};}),bot:B,carry:range(0,w).map(function(){return '';}),res:range(0,w).map(function(){return '';}),hl:-1};

function trucoTabla(a,b){
  var p=a*b,o;
  if(a===10||b===10){o=a===10?b:a;return 'Truco del 10: cuando multiplicas por 10, le agregas un cero. El '+o+' se vuelve '+p+'.';}
  if(a===9||b===9){o=a===9?b:a;return 'Truco del 9: '+o+' × 10 = '+(o*10)+', y le quitamos '+o+': '+(o*10)+' − '+o+' = '+p+'.';}
  if(a===5||b===5)return 'Truco del 5: las respuestas de la tabla del 5 siempre terminan en 0 o en 5.';
  if(a===2||b===2){o=a===2?b:a;return 'Truco del 2: es el doble. '+o+' + '+o+' = '+p+'.';}
  return 'Truco: el orden no importa. '+a+' × '+b+' da lo mismo que '+b+' × '+a+'. Si te sabes una, te sabes las dos.';
}
function pasosTabla(a,b){
  var p=a*b;function v(lit,eq){return {tipo:'tabla',a:a,b:b,lit:lit,eq:eq};}

    {texto:'Contamos de '+b+' en '+b+', fila por fila:',vis:v(0,a+' × '+b+' = ?'),anim:{tipo:'filas',n:a,paso:b}},
    {texto:trucoTabla(a,b),vis:v(a,a+' × '+b+' = ?')},

function pasosReparto(D,d,q){
  return [
    {texto:D+' ÷ '+d+' quiere decir: repartimos '+D+' en '+d+' grupos iguales. ¿Cuántos le tocan a cada grupo?',vis:{tipo:'reparto',D:D,d:d,q:q,fase:'inicio',eq:D+' ÷ '+d+' = ?'}},
    {texto:'Repartimos de uno en uno: en cada vuelta le damos uno a cada grupo.',vis:{tipo:'reparto',D:D,d:d,q:q,fase:'repartido',ocultar:true,eq:D+' ÷ '+d+' = ?'},anim:{tipo:'repartir',rondas:q}},
    {texto:'Dimos '+q+' vueltas. A cada grupo le tocaron '+q+'. Entonces '+D+' ÷ '+d+' = '+q+'.',vis:{tipo:'reparto',D:D,d:d,q:q,fase:'repartido',eq:D+' ÷ '+d+' = '+q}},

function pasosGalera(D,d){
  var dig=String(D).split('').map(Number),n=dig.length;
  var st={tipo:'galera',D:D,d:d,q:'',rows:[],hl:null};
  var out=[],snap=snapper(out,st);
  snap('Vamos a dividir '+D+' entre '+d+'. En la división trabajamos de izquierda a derecha.');
  var i=0,cur=dig[0];
  if(cur<d&&n>1){st.hl=[0,0];snap('Empezamos con el '+cur+'. ¿Cabe el '+d+' en '+cur+'? No, porque '+cur+' es menor que '+d+'. Entonces tomamos dos cifras: '+(cur*10+dig[1])+'.');i=1;cur=cur*10+dig[1];st.hl=[0,1];}
  else st.hl=[0,0];
  while(true){
    var qd=Math.floor(cur/d),prod=qd*d,r=cur-prod;
    st.q+=String(qd);
    if(qd===0){snap('¿Cuántas veces cabe el '+d+' en '+cur+'? Ninguna, porque '+cur+' es menor que '+d+'. Escribimos 0 en el cociente.');}
    else{
      st.rows.push({s:'−'+prod,end:i,line:true,cls:'producto'});
      st.rows.push({s:String(r),end:i});
      snap('¿Cuántas veces cabe el '+d+' en '+cur+'? '+qd+' '+(qd===1?'vez':'veces')+', porque '+d+' × '+qd+' = '+prod+'. Escribimos '+qd+' en el cociente. Restamos: '+cur+' − '+prod+' = '+r+'.');
    }
    if(i===n-1)break;
    i++;var nd=dig[i],nuevo=r*10+nd;
    var last=st.rows[st.rows.length-1];
    if(last){last.s=String(nuevo);last.end=i;}else{st.rows.push({s:String(nuevo),end:i});}
    st.hl=[i,i];
    snap('Bajamos el '+nd+'. Ahora tenemos '+nuevo+'.');
    cur=nuevo;
  }
  st.hl=null;
  snap('El residuo es 0: la división es exacta. '+D+' ÷ '+d+' = '+st.q+'.');

function pasos(p){
  if(p.lectura)return p.explicar();

/* Animaciones del profesor: contar, tachar, contar filas, repartir */
function correrAnim(an,tok){
  var q=function(i){return $('.obj[data-i="'+i+'"]',pantalla);};
  var vivo=function(){return tok===animTok;};
  function contar(idx,desde){
    var n=desde,cad=Promise.resolve();
    idx.forEach(function(i){var num=n++;cad=cad.then(function(){if(!vivo())return;var el=q(i);if(el){el.classList.add('s-lit');$('.num',el).textContent=num;}return hablarP(numPalabra(num),1400);});});
    return cad;
  }
  if(an.tipo==='contar')return contar(an.idx,an.desde);
  if(an.tipo==='seguir'){
    an.base.forEach(function(i){var el=q(i);if(el)el.classList.add('s-lit');});
    var ul=q(an.base[an.base.length-1]);if(ul)$('.num',ul).textContent=an.num;
    return hablarP(numPalabra(an.num),1400).then(function(){if(vivo())return contar(an.idx,an.desde);});
  }
  if(an.tipo==='tachar'){
    var n=1,cad=Promise.resolve();
    an.idx.forEach(function(i){var num=n++;cad=cad.then(function(){if(!vivo())return;var el=q(i);if(el)el.classList.add('s-cross');return hablarP(numPalabra(num),1400);});});
    return cad;
  }
  if(an.tipo==='filas'){
    var c2=Promise.resolve();
    range(0,an.n).forEach(function(r){c2=c2.then(function(){if(!vivo())return;var f=$('.fila[data-f="'+r+'"]',pantalla);if(f)f.classList.add('lit');return hablarP(String((r+1)*an.paso),1500);});});
    return c2;
  }
  if(an.tipo==='resaltar'){
    var els=$$(an.sel,pantalla),c4=Promise.resolve();
    els.forEach(function(el,i){c4=c4.then(function(){if(!vivo())return;els.forEach(function(x){x.classList.remove('on');});el.classList.add('on');return hablarP(an.voces&&an.voces[i]!=null?an.voces[i]:el.textContent.toLowerCase(),1800);});});
    return c4.then(function(){if(!vivo())return;els.forEach(function(x,i){x.classList.toggle('on',an.fin==null||i===an.fin);});if(an.final)return hablarP(an.final,3000);});
  }
  if(an.tipo==='repartir'){
    var c3=Promise.resolve();
    range(0,an.rondas).forEach(function(r){c3=c3.then(function(){if(!vivo())return;$$('.plato i[data-ronda="'+r+'"]',pantalla).forEach(function(i){i.classList.remove('oculto');});return sleep(650);});});
    return c3;
  }
  return Promise.resolve();
}

function escribir(d){
  var L=S.prob.L;if(S.activo<0||S.activo>=L)S.activo=S.prob.orden==='der'?L-1:0;
  S.entrada[S.activo]=String(d);

function comprobarGrande(){
  var p=S.prob,L=p.L,resp=String(p.resp);

  if(S.entrada.join('')===resp)return acierto();
  if(S.intentos===1){
    S.intentos=2;
    if(p.tipo==='columna'||p.tipo==='galera'){
      var malas=range(0,L).filter(function(i){return S.entrada[i]!==resp[i];}),buenas=range(0,L).filter(function(i){return S.entrada[i]===resp[i];});

      malas.forEach(function(i){S.entrada[i]='';});
      S.activo=p.orden==='der'?malas[malas.length-1]:malas[0];
      actualizarSlots();aviso(msg,true);
    } else {
      var pista=p.tipo==='tabla'?'Pista: '+p.a+' × '+p.b+' es sumar el '+p.b+', '+p.a+' veces. Cuenta de '+p.b+' en '+p.b+'.':'Pista: piensa en la tabla del '+p.d+'. ¿Qué número por '+p.d+' da '+p.D+'?';
      S.entrada=S.entrada.map(function(){return '';});S.activo=0;actualizarSlots();

function lcs(A,B){

  var marcas=A.map(function(){return false;});i=m;j=n;
  while(i>0&&j>0){if(eqPal(A[i-1],B[j-1])&&d[i][j]===d[i-1][j-1]+1){marcas[i-1]=true;i--;j--;}else if(d[i-1][j]>=d[i][j-1])i--;else j--;}

function elegirLec(i){

function oyenteOpciones(alts){
  var p=S.prob;if(!p||!p.ops||S.bloqueado)return null;
  var LET={a:0,b:1,be:1,c:2,ce:2,se:2,d:3,de:3,e:4};
  for(var a=0;a<alts.length;a++){
    var s=normal(alts[a]);if(!s)continue;var pri=s.split(' ')[0];
    for(var i=0;i<p.ops.length;i++){
      var o=p.ops[i],cs=[o.voz,o.t].filter(Boolean).map(function(x){return normal(sinT(x));});
      for(var j=0;j<cs.length;j++){var c=cs[j];if(!c)continue;

    }
    var m=s.match(/^(?:la |el |letra |opcion |la opcion |la letra )*(a|b|be|c|ce|se|d|de|e)$/);
    if(m&&LET[m[1]]<p.ops.length){elegirLec(LET[m[1]]);return 'Elegiste la '+'ABCDE'.charAt(LET[m[1]]);}

  alVolver=volverJuegos;S.oyente=oyenteArmar;

function actualizarArmado(){
  var p=S.prob,box=$('#armado',pantalla);if(!box)return;
  box.innerHTML=range(0,p.sol.length).map(function(i){var x=S.armado[i];return '<span class="hueco-armar'+(x?' lleno':'')+'">'+(x?esc(x.t):'&nbsp;')+'</span>';}).join('');
  var q=$('#b-quitar',pantalla);if(q)q.disabled=!S.armado.length;
}
function siguientesValidas(p){var k=S.armado.length;return solucionesArmar(p).filter(function(sol){return S.armado.every(function(y,j){return sol[j]===y.t;});}).map(function(sol){return sol[k];}).filter(Boolean);}
function ponerPieza(i){
  var p=S.prob;if(S.bloqueado||!p)return;var b=$('.pieza[data-i="'+i+'"]',pantalla);if(!b||b.disabled)return;
  var x=p.piezas[i],k=S.armado.length;
  if(siguientesValidas(p).indexOf(x)>=0){
    var foco=document.activeElement===b;
    S.armado.push({t:x,i:i});b.disabled=true;b.classList.add('usada');actualizarArmado();
    if(solucionesArmar(p).some(function(sol){return sol.length===S.armado.length&&S.armado.every(function(y,j){return sol[j]===y.t;});})){S.bloqueado=true;return acierto();}
    if(p.sep==='')decir(sinT(x.toLowerCase()));
    if(foco){var sig=$$('.pieza:not(:disabled)',pantalla)[0];if(sig)enfocar(sig);}
    return;
  }
  b.classList.remove('mal');void b.offsetWidth;b.classList.add('mal');
  S.errores++;
  if(S.errores>=p.maxErr){S.bloqueado=true;setTimeout(explicarError,700);return;}
  S.intentos=2;var h=p.pista?p.pista(k):'Esa no va ahí. Prueba otra.';aviso(h,false);decir(vozDe(h));
}
function quitarPieza(){if(S.bloqueado||!S.armado.length)return;var u=S.armado.pop(),b=$('.pieza[data-i="'+u.i+'"]',pantalla);if(b){b.disabled=false;b.classList.remove('usada');}actualizarArmado();}
function oyenteArmar(alts){
  var p=S.prob;if(!p||S.bloqueado)return null;
  for(var a=0;a<alts.length;a++){
    var ws=normal(alts[a]).split(' '),puestas=[];
    ws.forEach(function(w){if(S.bloqueado)return;var val=siguientesValidas(p);
      var b=$$('.pieza:not(:disabled)',pantalla).filter(function(el){return normal(sinT(el.dataset.txt))===normal(sinT(w))&&val.indexOf(p.piezas[+el.dataset.i])>=0;})[0];
      if(b){puestas.push(b.dataset.txt);ponerPieza(+b.dataset.i);}});
    if(puestas.length)return 'Pusiste: '+puestas.join(' ');
  }
  return null;
}
